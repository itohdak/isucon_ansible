# API key children use to authenticate when streaming metrics to the
# netdata parent (the host in the `pprotein` inventory group). It only
# needs to match between parent and children; regenerate with `uuidgen`
# if you want a fresh one (e.g. before a new competition).
netdata_stream_api_key: c245bd0d-2025-42cd-ab32-43273d85b8a3

# MySQL client invocation used by ansible to create the netdata monitoring user.
# ISUCON12's AMI protects root with a password (root/root); ISUCON11/13/14 use unix_socket
# auth instead (root@localhost, plugin unix_socket) so a plain `mysql -uroot` run as root
# (via become) authenticates without a password.
mysql_cli: mysql -uroot
