- name: Install the latest version of graphviz and gv
  ansible.builtin.apt:
    name:
      - graphviz
      - gv
    state: latest
    update_cache: yes
  become: true

- name: Install the latest version of netdata
  ansible.builtin.apt:
    name: netdata
    state: latest
    update_cache: yes
  become: true
  tags: [netdata]

- name: Update netdata config
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: /etc/netdata/netdata.conf
    backup: true
  become: true
  tags: [netdata]

- name: Deploy netdata stream config (parent, receives metrics from other instances)
  ansible.builtin.template:
    src: stream.conf.parent.j2
    dest: /etc/netdata/stream.conf
    owner: netdata
    group: netdata
    mode: '0640'
    backup: true
  become: true
  when: inventory_hostname in groups['pprotein']
  tags: [netdata]

- name: Deploy netdata stream config (child, streams metrics to the pprotein host)
  ansible.builtin.template:
    src: stream.conf.child.j2
    dest: /etc/netdata/stream.conf
    owner: netdata
    group: netdata
    mode: '0640'
    backup: true
  become: true
  when: inventory_hostname not in groups['pprotein']
  tags: [netdata]

- name: Restart netdata service
  ansible.builtin.shell: systemctl restart netdata
  become: true
  tags: [netdata]

- name: Update /etc/hosts
  ansible.builtin.shell: |
    echo 192.168.0.11  s1.maca.jp >> /etc/hosts
    echo 192.168.0.12  s2.maca.jp >> /etc/hosts
    echo 192.168.0.13  s3.maca.jp >> /etc/hosts
    echo 192.168.0.100 pprotein.maca.jp >> /etc/hosts
  become: true